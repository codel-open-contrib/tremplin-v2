services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tremplin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tremplin
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: tremplin_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tremplin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tremplin -d tremplin_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tremplin_redis
    restart: unless-stopped
    ports:      
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tremplin-network
    command: redis-server --appendonly yes --requirepass redis_dev_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: tremplin_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tremplin-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # backend NestJS API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tremplin-backend
    restart: unless-stopped
    environment:
      # Application
      NODE_ENV: development
      PORT: 3000
      
      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: tremplin_dev
      DATABASE_USER: tremplin
      DATABASE_PASSWORD: dev_password_123
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_dev_password
      
      # MinIO
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: tremplin-media
      
      # JWT (changez en production)
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRATION: 7d
      
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tremplin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend React App
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: tremplin-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - tremplin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Persistent Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# Réseau
networks:
  tremplin-network:
    driver: bridge
    name: tremplin-network
