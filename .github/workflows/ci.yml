name: CI Backend Tremplin Prime - STRICT

on:
  push:
    branches: [ live, main, develop ]
  pull_request:
    branches: [ live ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # ✅ v4 latest
    
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'
    
    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-modules-${{ hashFiles('backend/package-lock.json') }}
    
    - name: Install dependencies
      run: cd backend && npm ci
    
    # ✅ STRICT : ZERO ERRORS ESLint
    - name: ESLint Strict
      run: cd backend && npm run lint
    
    # ✅ STRICT : TypeScript compilation
    - name: TypeScript Check
      run: cd backend && npx tsc --noEmit
    
    # ✅ STRICT : Unit tests + coverage
    - name: Unit Tests
      run: cd backend && npm run test
    
    # ✅ STRICT : Coverage >80%
    - name: Test Coverage
      run: |
        cd backend
        npm run test:cov
        # Check coverage threshold
        grep -q "All files\|Statements.* 80" coverage/lcov-report/index.html || {
          echo "❌ Coverage <80% - Fix tests !"
          exit 1
        }
    
    # 🛡️ TRIVY STRICT : Security Scan
    - name: Docker Security Scan (STRICT)
      run: |
        docker build -t tremplin-backend:test .
        docker run --rm aquasec/trivy:latest image tremplin-backend:test \
          --severity CRITICAL,HIGH \
          --exit-code 1 \
          --no-progress \
          --format table
    
    # ✅ STRICT : Security Audit NPM
    - name: NPM Security Audit
      run: cd backend && npm audit --audit-level high
    
    # ✅ STRICT : Production Build
    - name: Production Build
      run: |
        cd backend
        npm run build
        echo "✅ Build OK - 0 errors"
    
    # ✅ Docker Build Test
    - name: Docker Build Test
      run: docker build -t tremplin-backend:test .
    
    # 🎉 SUCCESS Summary
    - name: CI Success Report
      if: success()
      run: |
        echo "| ✅ CI STRICT | 100% Green |" >> $GITHUB_STEP_SUMMARY
        echo "| 🧪 Tests | 100% PASS |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛡️ Security | No CRITICAL/HIGH |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Docker | Build OK |" >> $GITHUB_STEP_SUMMARY
        echo "🎉 Prêt pour démo soutenance !"
    
    # ❌ Failure Report
    - name: CI Failure Report
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          core.setFailed('❌ CI STRICT FAILED\nFix: ESLint/Tests/Security avant démo !')
