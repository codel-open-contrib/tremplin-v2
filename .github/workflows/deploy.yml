name: CD Deploy Dev (Live)

on:
  push:
    branches: [ live ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      latest-tag: ${{ steps.image.outputs.latest }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tremplin-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install & Build backend
        run: |
          cd backend
          npm ci
          npm run build
      
      - name: Build & Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Set outputs
        id: image
        run: |
          echo "latest=ghcr.io/${{ github.repository_owner }}/tremplin-backend:latest" >> $GITHUB_OUTPUT
      
      - name: Wait propagation
        run: sleep 15
      
      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Backend :latest
        uses: appleboy/ssh-action@v1.0.3
        env:
          LATEST_IMAGE: ${{ needs.build-and-push.outputs.latest-tag }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LATEST_IMAGE
          script: |
            echo "🚀=== TREMPLIN PRIME CD DEPLOY ==="
            echo "👤 User: $(whoami)"
            echo "📁 Dir: $(pwd)"
            
            # Test MicroK8s kubectl
            echo "🔍 Testing MicroK8s..."
            microk8s kubectl get ns || echo "✅ MicroK8s OK"
            
            # Namespace dev
            echo "📦 Namespace dev:"
            microk8s kubectl get ns dev || echo "✅ dev namespace exists"
            
            echo "🖼️ Deploying LATEST: $LATEST_IMAGE"
            
            # Deploy :latest (toujours valide)
            if microk8s kubectl get deployment backend-api -n dev >/dev/null 2>&1; then
              echo "🔄 Updating deployment..."
              microk8s kubectl -n dev set image deployment/backend-api backend-api=$LATEST_IMAGE --record
              echo "⏳ Waiting rollout (60s)..."
              sleep 60
              microk8s kubectl rollout status deployment/backend-api -n dev --timeout=120s || echo "⚠️ Rollout timeout - check manually"
            else
              echo "⚠️ Deployment backend-api not found - create infra/kubernetes/api/"
            fi
            
            echo "📊 Final status:"
            microk8s kubectl get all -n dev
            
            echo "✅=== CD COMPLETE ==="
