name: CD Deploy Dev (Live)

on:
  push:
    branches: [ live ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      latest-tag: ${{ steps.image.outputs.latest }}
      frontend-latest: ${{ steps.image.outputs.frontend-latest }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Check package.json
        run: cat backend/package.json

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tremplin-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build backend
        run: |
          cd backend
          rm -rf dist node_modules .tsbuildinfo tsconfig.build.tsbuildinfo
          npm ci
          npm run build

      - name: Remove old image
        run: docker rmi tremplin-backend:local || true

      - name: Build Backend Docker Locally
        run: docker build --no-cache -t tremplin-backend:local .

      - name: Trivy scan Backend
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'image'
          image-ref: 'tremplin-backend:local'
          format: 'table'
          exit-code: '1'
          vuln-type: 'library'
          severity: 'CRITICAL'

      - name: Build & Push Backend Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          platforms: linux/amd64

      - name: Docker meta Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tremplin-frontend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-web/package-lock.json'

      - name: Install & Build Frontend
        run: |
          cd frontend-web
          npm ci
          npm run build

      - name: Build Frontend Docker Locally
        run: docker build -t tremplin-frontend:local ./frontend-web

      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'tremplin-frontend:local'
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build & Push Frontend Docker
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Set outputs
        id: image
        run: |
          echo "latest=ghcr.io/${{ github.repository_owner }}/tremplin-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend-latest=ghcr.io/${{ github.repository_owner }}/tremplin-frontend:latest" >> $GITHUB_OUTPUT
      
      - name: Wait propagation
        run: sleep 15

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Backend and Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          LATEST_IMAGE: ${{ needs.build-and-push.outputs.latest-tag }}
          LATEST_FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend-latest }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LATEST_IMAGE,LATEST_FRONTEND_IMAGE
          script: |
            echo "🚀=== TREMPLIN BACKEND DEPLOY ==="
            cd ~

            sed -i "s|image: ghcr.io/.*tremplin-backend.*|image: ghcr.io/codel-open-contrib/tremplin-backend:live|g" backend-dev.yaml

            echo "🔄 Applying updated backend-dev.yaml..."
            microk8s kubectl apply -f backend-dev.yaml

            microk8s kubectl patch deployment backend-api -n dev -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-auth"}]}}}}'

            echo "🔄 Restarting backend deployment..."
            microk8s kubectl rollout restart deployment/backend-api -n dev

            echo "⏳ Waiting for backend rollout (max 120s)..."
            microk8s kubectl rollout status deployment/backend-api -n dev --timeout=120s

            echo "📊 Backend Pod Status:"
            microk8s kubectl get pods -n dev -l app.kubernetes.io/name=tremplin-backend

            echo "🚀=== TREMPLIN FRONTEND DEPLOY ==="

            sed -i "s|image: ghcr.io/.*tremplin-frontend.*|image: $LATEST_FRONTEND_IMAGE|g" frontend-dev.yaml

            echo "🔄 Applying updated frontend-dev.yaml..."
            microk8s kubectl apply -f frontend-dev.yaml

            microk8s kubectl patch deployment frontend-app -n dev -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-auth"}]}}}}'

            echo "🔄 Restarting frontend deployment..."
            microk8s kubectl rollout restart deployment/frontend-app -n dev

            echo "⏳ Waiting for frontend rollout (max 120s)..."
            microk8s kubectl rollout status deployment/frontend-app -n dev --timeout=120s

            echo "📊 Frontend Pod Status:"
            microk8s kubectl get pods -n dev -l app.kubernetes.io/name=tremplin-frontend
            echo "✅=== DEPLOY COMPLETE ==="
