name: CD Deploy Dev (Live)

on:
  push:
    branches: [ live ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/tremplin-backend
        tags: |
          type=sha,prefix={{branch}}-
          type=ref,event=branch
          type=latest
          type=sha  # ✅ Syntaxe correcte
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install deps & Build
      run: |
        cd backend
        npm ci
        npm run build
    
    - name: Build & Push Docker
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
    
    - name: Scan Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy VPS Dev
      uses: appleboy/ssh-action@v1.0.3
      env:
        IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          kubectl -n dev set image deployment/backend-api backend-api=$IMAGE_TAG --record || echo "Deployment pas encore créé (Jour 3)"
          kubectl rollout status deployment/backend-api -n dev --timeout=300s || echo "Waiting rollout..."
          kubectl get pods -n dev
