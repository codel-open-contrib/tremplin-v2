name: CD Deploy Dev (Live)

on:
  push:
    branches: [ live ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/tremplin-backend
        tags: |
          type=sha
          type=ref,event=branch
          type=ref,event=pr
          type=latest,suffix=-live
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'
    
    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
    
    - name: Install deps & Build
      run: |
        cd backend
        npm ci
        npm run build
    
    - name: Docker Build & Scan Trivy
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false
        sbom: false
        platforms: linux/amd64
    
    - name: Security Scan Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to VPS Dev Namespace
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/${{ secrets.VPS_USER }}/tremplin-v2 || mkdir -p /home/${{ secrets.VPS_USER }}/tremplin-v2
          git -C /home/${{ secrets.VPS_USER }}/tremplin-v2 pull origin live || git clone https://github.com/${{ github.repository }} /home/${{ secrets.VPS_USER }}/tremplin-v2
          cd /home/${{ secrets.VPS_USER }}/tremplin-v2/infra/kubernetes/api
          kubectl set image deployment/backend-api backend-api=ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }} -n dev --record
          kubectl rollout status deployment/backend-api -n dev --timeout=300s
          kubectl get pods -n dev -o wide
