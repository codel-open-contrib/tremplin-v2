name: CD Deploy Dev (Live)

on:
  push:
    branches: [ live ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      latest-tag: ${{ steps.image.outputs.latest }}
      sha-tag: ${{ steps.image.outputs.sha }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tremplin-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=live-${{ github.sha }}
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install & Build
        run: |
          cd backend
          npm ci
          npm run build
      
      - name: Build & Push Docker
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Set image tags output
        id: image
        run: |
          echo "latest=ghcr.io/${{ github.repository_owner }}/tremplin-backend:latest" >> $GITHUB_OUTPUT
          echo "sha=ghcr.io/${{ github.repository_owner }}/tremplin-backend:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Wait for image propagation
        run: sleep 15
      
      - name: Scan Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          LATEST_IMAGE: ${{ needs.build-and-push.outputs.latest-tag }}
          SHA_IMAGE: ${{ needs.build-and-push.outputs.sha-tag }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LATEST_IMAGE,SHA_IMAGE
          script: |
            echo "🚀 VPS Connection OK - User: $(whoami)"
            echo "📁 Current dir: $(pwd)"
            
            # Vérifier kubectl
            kubectl version --short || { echo "❌ kubectl KO"; exit 1; }
            
            # Namespace dev
            kubectl get ns dev || { echo "✅ dev namespace OK"; }
            
            echo "🖼️ LATEST Image: $LATEST_IMAGE"
            echo "🖼️  SHA Image: $SHA_IMAGE"
            
            # Deploy latest (toujours valide)
            if kubectl get deployment backend-api -n dev >/dev/null 2>&1; then
              echo "🔄 Updating existing deployment..."
              kubectl -n dev set image deployment/backend-api backend-api=$LATEST_IMAGE --record
              kubectl rollout status deployment/backend-api -n dev --timeout=180s || echo "⚠️ Rollout timeout - check logs"
            else
              echo "⚠️ No deployment found - create infra/kubernetes/api/deployment.yaml first"
            fi
            
            echo "📦 Pods status:"
            kubectl get pods -n dev -o wide
            
            echo "✅ CD Deploy terminé - Backend :latest déployé !"
