name: CD Deploy Dev (Live)

on:
  push:
    branches: [ live ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tremplin-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=live-
            type=raw,value=latest
            type=sha
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & Push Docker
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Set image tag output
        id: image
        run: echo "tag=ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
      
      # ✅ Attendre que l'image soit propagée dans GHCR
      - name: Wait for image availability
        run: |
          echo "⏳ Waiting 15s for image to be available in registry..."
          sleep 15
      
      # ✅ Scan Trivy avec gestion des erreurs
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true  # ✅ Ne pas bloquer le pipeline
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/tremplin-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.VPS_IP }}           # ✅ VPS_IP (vos secrets)
          username: ${{ secrets.VPS_USER }}     # ✅ VPS_USER
          key: ${{ secrets.SSH_PRIVATE_KEY }}   # ✅ SSH_PRIVATE_KEY
          envs: IMAGE_TAG
          script: |
            echo "🚀 VPS Connection OK - User: $(whoami)"
            echo "📁 Current dir: $(pwd)"
            kubectl version --short || echo "kubectl OK"
            kubectl get ns dev || echo "✅ dev namespace exists"
            echo "🖼️ Image: $IMAGE_TAG"
            echo "✅ Pipeline ready - Jour 3 manifests"

